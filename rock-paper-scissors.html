<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button class="btn">Rock</button>
    <button class="btn">Paper</button>
    <button class="btn">Scissors</button>
    <div class="result"></div>
    <div class="currentScore"></div>
    <div class="winner"></div>
    <script>
        function getComputerChoice() {
            let randNum = Math.floor(Math.random() * 10)
            if (randNum <= 3) {
                return "Rock"
            }

            else if (randNum <= 6) {
                return "Paper"
            }
            else if (randNum <= 9) {
                return "Scissors"
            }
        }

        //console.log(getComputerChoice());

        // function getHumanChoice() {
        //     let selectedChoice = (prompt("What is your choice?")).toLowerCase()
        //     return selectedChoice
        // }



        //console.log(getHumanChoice());
        function playGame(selectedOption) {
            function playRound(humanChoice = selectedOption, computerChoice = getComputerChoice()) {

                if (humanChoice == "rock" && computerChoice == "Scissors") {
                    log = "You win! Rock beats Scissors"
                    humanScore++
                }
                else if (humanChoice == "rock" && computerChoice == "Paper") {
                    log = "You lose! Paper beats Rock"
                    computerScore++
                }
                else if (humanChoice == "paper" && computerChoice == "Rock") {
                    log = "You win! Paper beats Rock"
                    humanScore++
                }
                else if (humanChoice == "paper" && computerChoice == "Scissors") {
                    log = "You lose! Scissors beats Paper"
                    computerScore++
                }
                else if (humanChoice == "scissors" && computerChoice == "Paper") {
                    log = "You win! Scissors beats Paper"
                    humanScore++
                }
                else if (humanChoice == "scissors" && computerChoice == "Rock") {
                    log = "You lose! Rock beats scissors"
                    computerScore++
                }
                else if (humanChoice == computerChoice.toLowerCase()) {
                    log = `You draw! You both picked ${humanChoice}!`
                }
                console.log(log)
            }
            playRound()
        }
        // console.log(playGame())

        let humanScore = 0;
        let computerScore = 0;
        let i = 0;
        let log = ''

        let button = document.querySelectorAll('button')
        button.forEach(btn => btn.addEventListener('click', e => {
            let selectedOption = e.target.textContent.toLowerCase();
            console.log(selectedOption)
            playGame(selectedOption)
            let result = document.querySelector('.result')
            result.innerText = log
            let winner = document.querySelector('.winner')
            winner.textContent = ''
            let currentScore = document.querySelector('.currentScore')
            currentScore.textContent = `The current score is Human:${humanScore} and Computer:${computerScore}.`
            if (humanScore == 5) {
                winner.textContent = 'Human won!'
                humanScore = 0;
                computerScore = 0;
            }
            else if (computerScore == 5) { 
                winner.textContent = 'Computer won!'
                humanScore = 0;
                computerScore = 0;
             }
        }))
    </script>
</body>

</html>
