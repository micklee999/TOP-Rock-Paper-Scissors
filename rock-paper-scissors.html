<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function getComputerChoice() {
            let randNum = Math.floor(Math.random() * 10)
            if (randNum <= 3) {
                return "Rock"
            }

            else if (randNum <= 6) {
                return "Paper"
            }
            else if (randNum <= 9) {
                return "Scissors"
            }
        }

        //console.log(getComputerChoice());

        function getHumanChoice() {
            let selectedChoice = (prompt("What is your choice?")).toLowerCase()
            return selectedChoice
        }

        //console.log(getHumanChoice());
        function playGame() {
            let humanScore = 0;
            let computerScore = 0;
            let i = 0;
            function playRound(humanChoice = getHumanChoice(), computerChoice = getComputerChoice()) {
                if (humanChoice == "rock" && computerChoice == "Scissors") {
                    console.log("You win! Rock beats Scissors")
                    humanScore++
                }
                else if (humanChoice == "rock" && computerChoice == "Paper") {
                    console.log("You lose! Paper beats Rock")
                    computerScore++
                }
                else if (humanChoice == "paper" && computerChoice == "Rock") {
                    console.log("You win! Paper beats Rock")
                    humanScore++
                }
                else if (humanChoice == "paper" && computerChoice == "Scissors") {
                    console.log("You lose! Scissors beats Paper")
                    computerScore++
                }
                else if (humanChoice == "scissors" && computerChoice == "Paper") {
                    console.log("You win! Scissors beats Paper")
                    humanScore++
                }
                else if (humanChoice == "scissors" && computerChoice == "Rock") {
                    console.log("You lose! Rock beats scissors")
                    computerScore++
                }
                else if (humanChoice == computerChoice.toLowerCase()) {
                    console.log(`You draw! You both picked ${humanChoice}!`)
                }
            }
            while (i < 5) {
                    playRound();
                    i++
                console.log(`The current score is Human:${humanScore} and Computer:${computerScore}.`)
                }
        }
        console.log(playGame())
    </script>
</body>

</html>
